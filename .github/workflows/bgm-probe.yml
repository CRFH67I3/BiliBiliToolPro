name: bgm-probe

# 一次性探测：确认「追番」列表条目的字段结构（仅手动触发，用完删除）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump follow-list item shape
        env:
          COOKIESTR: ${{ secrets.COOKIESTR }}
        run: |
          set -u
          if [ -z "${COOKIESTR:-}" ]; then echo "::error::COOKIESTR 未配置"; exit 1; fi

          mid=$(printf '%s' "$COOKIESTR" | tr ';' '\n' | sed -n 's/^[[:space:]]*DedeUserID=//p' | tr -d '\r\n')
          echo "::add-mask::$mid"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'

          curl -s "https://api.bilibili.com/x/space/bangumi/follow/list?type=1&follow_status=3&pn=1&ps=12&vmid=${mid}&order=0&sort=0" \
            -H "Cookie: $COOKIESTR" -H "User-Agent: $UA" \
            -H "Referer: https://space.bilibili.com/${mid}/bangumi" -o /tmp/list.json

          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/list.json'))
          items = (d.get('data') or {}).get('list') or []
          print('code=', d.get('code'), 'items=', len(items))
          it = items[0]
          print('--- all keys ---')
          print(sorted(it.keys()))
          print('--- picked fields ---')
          for k in ['season_id','season_type','title','progress','follow_status','can_watch',
                    'new_ep','first_ep','first_ep_index','total_count','publish','season_status',
                    'badge','badge_ep','is_started']:
              if k in it:
                  print(f'{k} =', json.dumps(it[k], ensure_ascii=False)[:300])
          print('--- 所有条目的 progress / new_ep.id / first_ep ---')
          for x in items:
              print(x.get('season_id'), '|', str(x.get('title'))[:14], '| progress=', x.get('progress'),
                    '| new_ep=', json.dumps(x.get('new_ep'), ensure_ascii=False)[:60],
                    '| first_ep=', json.dumps(x.get('first_ep'), ensure_ascii=False)[:60])
          PY
