name: ogv-probe

# 一次性探测：验证「观看剧集内容」任务第 1 步 receive/v2 补上 build 后是否返回 code=0
# 只发只读/领取类请求，不实现后续链路，跑完即可删除本文件
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check login state
        env:
          COOKIESTR: ${{ secrets.COOKIESTR }}
        run: |
          if [ -z "$COOKIESTR" ]; then echo "::error::COOKIESTR is empty"; exit 1; fi
          curl -s 'https://api.bilibili.com/x/web-interface/nav' \
            -H "Cookie: $COOKIESTR" \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -o /tmp/nav.json
          jq -r '"nav: code=\(.code) isLogin=\(.data.isLogin) uname=\(.data.uname) level=\(.data.level) vipStatus=\(.data.vipStatus) vipType=\(.data.vipType)"' /tmp/nav.json \
            || { echo "nav raw:"; head -c 300 /tmp/nav.json; }

      - name: Extract csrf and buvid from cookie
        env:
          COOKIESTR: ${{ secrets.COOKIESTR }}
        run: |
          csrf=$(printf '%s' "$COOKIESTR" | tr ';' '\n' | sed -n 's/^[[:space:]]*bili_jct=//p' | tr -d '\r\n')
          buvid=$(printf '%s' "$COOKIESTR" | tr ';' '\n' | sed -n 's/^[[:space:]]*buvid3=//p' | tr -d '\r\n')
          if [ -z "$csrf" ]; then echo "::error::bili_jct not found in COOKIESTR"; exit 1; fi
          # 只输出长度，不输出凭证本身
          echo "csrf_len=${#csrf} buvid_len=${#buvid}"
          {
            echo "BILI_CSRF=$csrf"
            echo "BILI_BUVID=$buvid"
          } >> "$GITHUB_ENV"

      - name: Step 1 A - receive/v2 WITH build
        env:
          COOKIESTR: ${{ secrets.COOKIESTR }}
        run: |
          echo "=== A: 带 build（期望 code=0） ==="
          curl -s 'https://api.bilibili.com/pgc/activity/score/task/receive/v2' \
            -H "Cookie: $COOKIESTR" \
            -H 'User-Agent: Mozilla/5.0 BiliDroid/8.45.1 (bbcallen@gmail.com) os/android model/SM-S9210 mobi_app/android build/8451100 channel/bili innerVer/8451110 osVer/12 network/2' \
            -H 'referer: https://big.bilibili.com/mobile/bigPoint/task' \
            -H 'native_api_from: h5' \
            --data-urlencode 'taskCode=ogvwatchnew' \
            --data-urlencode 'build=8451100' \
            --data-urlencode "csrf=$BILI_CSRF" \
            --data-urlencode "buvid=$BILI_BUVID" \
            --data-urlencode 'platform=android' \
            --data-urlencode 'mobi_app=android' \
            --data-urlencode 'device=phone' \
            --data-urlencode 'channel=bili' \
            --data-urlencode 'disable_rcmd=0' \
            -o /tmp/a.json
          jq -r '"A: code=\(.code) message=\(.message)"' /tmp/a.json \
            || { echo "A raw:"; head -c 500 /tmp/a.json; }
          echo "--- 响应 data 顶层结构 ---"
          jq -r '(.data // {}) | keys | join(", ")' /tmp/a.json 2>/dev/null || true

      - name: Step 1 B - control without build
        env:
          COOKIESTR: ${{ secrets.COOKIESTR }}
        run: |
          echo "=== B: 不带 build（对照组，预期 6007000 或 -400） ==="
          sleep 3
          curl -s 'https://api.bilibili.com/pgc/activity/score/task/receive/v2' \
            -H "Cookie: $COOKIESTR" \
            -H 'User-Agent: Mozilla/5.0 BiliDroid/8.45.1 (bbcallen@gmail.com) os/android model/SM-S9210 mobi_app/android build/8451100 channel/bili innerVer/8451110 osVer/12 network/2' \
            -H 'referer: https://big.bilibili.com/mobile/bigPoint/task' \
            -H 'native_api_from: h5' \
            --data-urlencode 'taskCode=ogvwatchnew' \
            --data-urlencode "csrf=$BILI_CSRF" \
            --data-urlencode "buvid=$BILI_BUVID" \
            --data-urlencode 'platform=android' \
            --data-urlencode 'mobi_app=android' \
            -o /tmp/b.json
          jq -r '"B: code=\(.code) message=\(.message)"' /tmp/b.json \
            || { echo "B raw:"; head -c 500 /tmp/b.json; }

      - name: Read current ogv task state
        env:
          COOKIESTR: ${{ secrets.COOKIESTR }}
        run: |
          echo "=== 任务列表中的 ogv 任务状态 ==="
          curl -s 'https://api.bilibili.com/x/vip_point/task/combine' \
            -H "Cookie: $COOKIESTR" \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -o /tmp/combine.json
          jq -r '"combine: code=\(.code) point=\(.data.point_info.point // "n/a")"' /tmp/combine.json \
            || { echo "combine raw:"; head -c 400 /tmp/combine.json; }
          echo "--- 模块标题 ---"
          jq -r '(.data.task_info.modules // [])[] | "\(.module_title)"' /tmp/combine.json 2>/dev/null || true
          echo "--- 含 ogv 的任务项 ---"
          jq -c '(.data.task_info.modules // [])[] | .module_title as $m | (.tasks // [])[] | select((.task_code // "") | test("ogv")) | {module:$m, task_code:.task_code, title:.title, state:.state, complete_times:.complete_times}' /tmp/combine.json 2>/dev/null || true
