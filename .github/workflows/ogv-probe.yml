name: ogv-probe

# 一次性探测：定位「观看剧集内容」6007000 的真实原因
# 第二轮：对比 App UA 与网页 UA，并 dump 任务结构
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe receive/v2 with both UAs
        env:
          COOKIESTR: ${{ secrets.COOKIESTR }}
        run: |
          set -u
          if [ -z "$COOKIESTR" ]; then echo "::error::COOKIESTR is empty"; exit 1; fi

          # 同一步内提取，绝不写入 GITHUB_ENV（否则会以明文出现在日志 env 块里）
          csrf=$(printf '%s' "$COOKIESTR" | tr ';' '\n' | sed -n 's/^[[:space:]]*bili_jct=//p' | tr -d '\r\n')
          buvid=$(printf '%s' "$COOKIESTR" | tr ';' '\n' | sed -n 's/^[[:space:]]*buvid3=//p' | tr -d '\r\n')
          echo "::add-mask::$csrf"
          echo "::add-mask::$buvid"

          UA_APP='Mozilla/5.0 BiliDroid/8.45.1 (bbcallen@gmail.com) os/android model/SM-S9210 mobi_app/android build/8451100 channel/bili innerVer/8451110 osVer/12 network/2'
          UA_WEB='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          URL='https://api.bilibili.com/pgc/activity/score/task/receive/v2'

          call() {
            label="$1"; ua="$2"; with_build="$3"; with_app_headers="$4"
            args=""
            [ "$with_build" = "yes" ] && args="$args --data-urlencode build=8451100"
            if [ "$with_app_headers" = "yes" ]; then
              extra=(-H 'referer: https://big.bilibili.com/mobile/bigPoint/task' -H 'native_api_from: h5')
            else
              extra=()
            fi
            curl -s "$URL" \
              -H "Cookie: $COOKIESTR" \
              -H "User-Agent: $ua" \
              "${extra[@]}" \
              --data-urlencode 'taskCode=ogvwatchnew' \
              --data-urlencode "csrf=$csrf" \
              --data-urlencode "buvid=$buvid" \
              --data-urlencode 'platform=android' \
              --data-urlencode 'mobi_app=android' \
              $args \
              -o /tmp/r.json
            printf '%-46s => %s\n' "$label" "$(jq -r '"code=\(.code) message=\(.message)"' /tmp/r.json 2>/dev/null || head -c 200 /tmp/r.json)"
            sleep 3
          }

          echo "########## 对照实验 ##########"
          call "C: APP UA + build + app headers"              "$UA_APP" yes yes
          call "D: APP UA, no build"                          "$UA_APP" no  yes
          call "E: WEB UA + build (项目当前形态)"              "$UA_WEB" yes no
          call "F: WEB UA + build + app headers"              "$UA_WEB" yes yes
          call "G: WEB UA, no build"                          "$UA_WEB" no  no

      - name: Dump task structure
        env:
          COOKIESTR: ${{ secrets.COOKIESTR }}
        run: |
          set -u
          curl -s 'https://api.bilibili.com/x/vip_point/task/combine' \
            -H "Cookie: $COOKIESTR" \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -o /tmp/combine.json
          echo "combine: $(jq -r '"code=\(.code) point=\(.data.point_info.point // "n/a")"' /tmp/combine.json 2>/dev/null || head -c 200 /tmp/combine.json)"
          echo "########## data 顶层 keys ##########"
          jq -r '(.data // {}) | keys | join(", ")' /tmp/combine.json 2>/dev/null || true
          echo "########## modules 结构 ##########"
          jq -r '(.data.task_info.modules // [])[] | "MODULE [\(.module_title)] keys=\(keys|join(",")) task_count=\((.tasks // [])|length)"' /tmp/combine.json 2>/dev/null || true
          echo "########## 任务明细（全部） ##########"
          jq -r '(.data.task_info.modules // [])[] | .module_title as $m | (.tasks // [])[] | "\($m) | id=\(.task_id // "-") | code=\(.task_code // "-") | title=\(.title // .task_name // "-") | state=\(.state // "-") | times=\(.complete_times // "-")"' /tmp/combine.json 2>/dev/null || true
