# Bilibili task runner (manual + scheduled)
# Revived from platforms/gitHubActions/bak/bilibili-daily-task.yml:
# - .NET 10 (was 6)
# - actions/checkout@v4, setup-dotnet@v4 (was v2/v1)
# - dropped broken pre-check job that referenced undefined IsOpenDailyTask
# - dropped deprecated ::set-output syntax
# - every optional env mapping now has a fallback default: an undefined secret
#   expands to "", and an empty value OVERRIDES appsettings.json (Serilog then
#   fails parsing "" into the LogEventLevel enum -> exit code 134)
# - "&"-joined task lists are passed through a quoted env var: unquoted, bash
#   would treat "&" as a background operator and silently drop the rest
#
# Scheduled run: Daily & VipBigPoint & MangaPrivilege & Manga & Silver2Coin,
# once per day at 12:00 Asia/Shanghai (= 04:00 UTC, cron is always UTC).
# No random delay and no waiting step: GitHub scheduled runs on this account
# are unreliable (observed delays of several hours), so the job simply runs
# whenever the cron actually fires instead of sleeping to a chosen minute.
# (VipPrivilege omitted on purpose - Daily already claims the same benefits)

name: bilibili-task

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Tasks to run, join multiple with &. e.g. Daily&VipBigPoint"
        required: true
        default: "Daily"
  schedule:
    # 04:00 UTC = 12:00 Asia/Shanghai. cron 一律按 UTC 计算。
    - cron: "0 4 * * *"

env:
  ASPNETCORE_ENVIRONMENT: ${{ secrets.ENV || 'Production' }}
  Ray_BiliBiliCookies__1: ${{ secrets.COOKIESTR }}
  Ray_BiliBiliCookies__2: ${{ secrets.COOKIESTR2 }}
  Ray_BiliBiliCookies__3: ${{ secrets.COOKIESTR3 }}

  # Push channels: an empty URL/token means "disabled", same as appsettings default
  Ray_Serilog__WriteTo__3__Args__botToken: ${{ secrets.PUSHTGTOKEN }}
  Ray_Serilog__WriteTo__3__Args__chatId: ${{ secrets.PUSHTGCHATID }}
  Ray_Serilog__WriteTo__3__Args__restrictedToMinimumLevel: ${{ secrets.PUSHTGLEVEL || 'Information' }}
  Ray_Serilog__WriteTo__4__Args__webHookUrl: ${{ secrets.PUSHWEIXINURL }}
  Ray_Serilog__WriteTo__4__Args__restrictedToMinimumLevel: ${{ secrets.PUSHWEIXINLEVEL || 'Information' }}
  Ray_Serilog__WriteTo__5__Args__restrictedToMinimumLevel: ${{ secrets.PUSHDINGLEVEL || 'Information' }}
  Ray_Serilog__WriteTo__6__Args__scKey: ${{ secrets.PUSHSCKEY }}
  Ray_Serilog__WriteTo__6__Args__turboScKey: ${{ secrets.PUSHSERVERTSCKEY }}
  Ray_Serilog__WriteTo__6__Args__restrictedToMinimumLevel: ${{ secrets.PUSHSERVERLEVEL || 'Information' }}
  Ray_Serilog__WriteTo__9__Args__token: ${{ secrets.PUSHPLUSTOKEN }}
  Ray_Serilog__WriteTo__9__Args__topic: ${{ secrets.PUSHPLUSTOPIC }}
  Ray_Serilog__WriteTo__9__Args__channel: ${{ secrets.PUSHPLUSCHANNEL }}
  Ray_Serilog__WriteTo__9__Args__webhook: ${{ secrets.PUSHPLUSWEBHOOK }}
  Ray_Serilog__WriteTo__9__Args__restrictedToMinimumLevel: ${{ secrets.PUSHPLUSLEVEL || 'Information' }}
  Ray_Serilog__WriteTo__0__Args__restrictedToMinimumLevel: ${{ secrets.CONSOLELOGLEVEL || 'Information' }}

  # Security
  Ray_Security__IsSkipDailyTask: ${{ secrets.ISSKIPDAILYTASK || 'false' }}
  Ray_Security__IntervalSecondsBetweenRequestApi: ${{ secrets.INTERVALSECONDSBETWEENREQUESTAPI || '10' }}
  Ray_Security__RandomSleepMaxMin: ${{ secrets.RANDOMSLEEPMAXMIN || '0' }}

  # Daily task config
  Ray_DailyTaskConfig__NumberOfCoins: ${{ secrets.NUMBEROFCOINS || '5' }}
  Ray_DailyTaskConfig__SaveCoinsWhenLv6: ${{ secrets.SAVECOINSWHENLV6 || 'false' }}
  Ray_DailyTaskConfig__SelectLike: ${{ secrets.SELECTLIKE || 'true' }}
  Ray_DailyTaskConfig__SupportUpIds: ${{ secrets.SUPPORTUPIDS }}

jobs:
  run-task:
    runs-on: ubuntu-latest
    # Tasks take ~15min (VipBigPoint waits 610s for the ogv countdown). 90min
    # leaves headroom without letting a stuck run leak a runner for hours.
    timeout-minutes: 90
    steps:
      - name: Set time zone
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # DingTalk webhook is assembled from token + sign secret.
      # The sink adds timestamp/sign automatically when the URL contains "secret=".
      - name: Configure DingTalk push
        env:
          DING_TOKEN: ${{ secrets.PUSHDINGTOKEN }}
          DING_SECRET: ${{ secrets.PUSHDINGSECRET }}
        run: |
          if [ -n "$DING_TOKEN" ] && [ -n "$DING_SECRET" ]; then
            echo "RAY_SERILOG__WRITETO__5__ARGS__WEBHOOKURL=https://oapi.dingtalk.com/robot/send?access_token=${DING_TOKEN}&secret=${DING_SECRET}" >> "$GITHUB_ENV"
          else
            echo "DingTalk secrets not set, skipping push configuration"
          fi

      # Tasks are joined with "&", which bash treats as a background operator.
      # Always pass the value through a quoted env var, never inline unquoted.
      - name: Run task (manual input)
        if: github.event_name == 'workflow_dispatch'
        working-directory: ./src/Ray.BiliBiliTool.Console
        env:
          TASKS: ${{ github.event.inputs.tasks }}
        run: dotnet run -- --runTasks="$TASKS"

      # Scheduled order matters: Daily runs first so that VipBigPoint sees the
      # watch/share status already completed and skips its own video pass.
      # VipPrivilege is intentionally absent: Daily already calls the exact same
      # VipPrivilegeDomainService.ReceiveVipPrivilege (same IsEnable switch), so
      # running it separately would only return "already claimed" twice a day.
      - name: Run scheduled tasks
        if: github.event_name == 'schedule'
        working-directory: ./src/Ray.BiliBiliTool.Console
        env:
          TASKS: "Daily&VipBigPoint&MangaPrivilege&Manga&Silver2Coin"
        run: dotnet run -- --runTasks="$TASKS"
