# 自动同步上游仓库

name: Sync fork with upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1,3,5'
    # UTC时区，比我们东八区早8小时，上面示例为：每周一、三、五的9点。
    # 注意 GitHub 的 cron 只是"计划在这个时刻触发"，实际可能排队几小时。

# 用仓库内置的 GITHUB_TOKEN 推送，不再依赖 repo-sync 和手写 PAT。
# 内置 token 只能写当前仓库，而这里上游只读、目标就是本仓库，正好够用。
permissions:
  contents: write

jobs:
  sync-upstream:
    name: Sync upstream main
    if: ${{ github.repository != 'RayWangQvQ/BiliBiliToolPro' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/RayWangQvQ/BiliBiliToolPro.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          # 本 fork 有自己的提交（自定义 CI 工作流），所以上游前进时无法快进，
          # 用 -X ours：代码取上游，冲突处保留本 fork 的改动（主要就是 workflows）。
          git merge --no-edit -X ours -m "chore: sync with upstream main" upstream/main
          git push origin HEAD:main
